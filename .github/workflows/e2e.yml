name: End-to-end Test
on: 
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:
# test input_file_extension
# test output
jobs:
  package_manager_test:
    name: test different package managers
    strategy:
      matrix:
        pkg_manager: ['npm', 'pnpm', 'bun']
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup_pkg_manager
        with:
          pkg_manager: ${{matrix.pkg_manager}}
      - name: setup basic mermaid file
        run: mkdir public
      - name: add sample mmd file
        uses: ./.github/actions/add_input_file
        with:
          basename: sample
          output_dir: public
      - name: generate mermaid file
        uses: ./
        with:
          pkg_manager: ${{matrix.pkg_manager}}
      - name: check for gen diagram
        run: cat public/sample.svg
  all_input_same_output_dir_test:
    name: Test, with input_dir = 'all', and output_dir = 'same'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
      - name: check for generated mermaid files
        run: |
          cat sample.svg
          cat dir1/sample.svg
          cat dir2/sample.svg
          cat dir1/extra.svg
  all_input_specific_output_dir_test:
    name: Test, with input_dir = 'all', and output_dir = 'output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
          mkdir output
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample0
          output_dir: '.'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample1
          output_dir: 'dir1'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample2
          output_dir: 'dir2'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample3
          output_dir: 'dir1'
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: output
      - name: check for generated mermaid files
        run: |
          cat output/sample0.svg
          cat output/sample1.svg
          cat output/sample2.svg
          cat output/sample3.svg
  specific_input_same_output_dir_test:
    name: Test, with input_dir = 'input', and output_dir = 'same'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir input
          mkdir dir2
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample0
          output_dir: '.'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample1
          output_dir: 'input'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample2
          output_dir: 'input'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample3
          output_dir: 'dir2'
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_dir: 'input'
          output_dir: 'same'
      - name: check for generated mermaid files
        run: |
          cat input/sample1.svg
          cat input/sample2.svg
      - name: check for missing mermaid files
        run: |
          cat input/sample0.svg
        continue-on-error: true
        id: failed-step
      - if: ${{steps.failed-step.outcome != 'failure'}}
        run: exit 1
  output_file_extension_test:
    name: Test different output file extensions 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        output_file_extension: ['svg', 'png', 'pdf']
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
          output_file_extension: ${{matrix.output_file_extension}}
        id: mermaid-action
      - name: check for generated mermaid files
        run: |
          cat sample.${{matrix.output_file_extension}}
          cat dir1/sample.${{matrix.output_file_extension}}
          cat dir2/sample.${{matrix.output_file_extension}}
          cat dir1/extra.${{matrix.output_file_extension}}
  input_file_extension_test:
    name: Test different input file extensions 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        input_file_extension: ['mmd', 'txt', 'mermaid']
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir1'
          extension: ${{matrix.input_file_extension}}
      - uses: "./.github/actions/add_input_file"
        with:
          basename: extra
          output_dir: 'dir1'
          extension: ${{matrix.input_file_extension}}
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_file_extension: ${{matrix.input_file_extension}}
          input_dir: 'dir1'
          output_dir: 'same'
        id: mermaid-action
      - name: check for generated mermaid files
        run: |
          cat dir1/sample.svg
          cat dir1/extra.svg
  output_test:
    name: Test output variable has all files that should be regen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_input_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "./"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
        id: mermaid-gen
      - name: check for generated mermaid files
        uses: './.github/actions/check_output'
        with:
          expected_input_files: '["sample.mmd", "dir1/sample.mmd", "dir1/extra.mmd", "dir2/sample.mmd"]'
          expected_output_files: '["sample.svg", "dir1/sample.svg", "dir1/extra.svg", "dir2/sample.svg"]'
          actual_input_files: ${{steps.mermaid-gen.outputs.input_files}}
          actual_output_files: ${{steps.mermaid-gen.outputs.output_files}}