name: End-to-end Test
on: 
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  package_manager_test:
    name: test different package managers
    continue-on-error: true
    strategy:
      matrix:
        pkg_manager: ['npm', 'pnpm', 'bun']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          repository: mermaid-maker/e2e
      - uses: ./.github/actions/setup_pkg_manager
        with:
          pkg_manager: ${{matrix.pkg_manager}}
      - name: setup basic mermaid file
        run: mkdir public
      - name: add sample mmd file
        uses: ./.github/actions/add_mmd_file
        with:
          basename: sample
          output_dir: public
      - name: generate mermaid file
        uses: mermaid-maker/action@main
        with:
          pkg_manager: ${{matrix.pkg_manager}}
      - name: check for gen diagram
        run: cat public/sample.svg
  all_input_same_output_dir_test:
    name: Test, with input_dir = 'all', and output_dir = 'same'
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: mermaid-maker/e2e
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "mermaid-maker/action@main"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
      - name: check for generated mermaid files
        run: |
          cat sample.svg
          cat dir1/sample.svg
          cat dir2/sample.svg
          cat dir1/extra.svg
  all_input_specific_output_dir_test:
    name: Test, with input_dir = 'all', and output_dir = 'output'
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: mermaid-maker/e2e
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: npm
      - run: |
          mkdir dir1
          mkdir dir2
          mkdir output
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample0
          output_dir: '.'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample1
          output_dir: 'dir1'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample2
          output_dir: 'dir2'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample3
          output_dir: 'dir1'
      - uses: "mermaid-maker/action@main"
        with:
          pkg_manager: 'npm'
          input_dir: 'all'
          output_dir: output
      - name: check for generated mermaid files
        run: |
          cat output/sample0.svg
          cat output/sample1.svg
          cat output/sample2.svg
          cat output/sample3.svg
  specific_input_same_output_dir_test:
    name: Test, with input_dir = 'input', and output_dir = 'same'
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: mermaid-maker/e2e
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: pnpm
      - run: |
          mkdir input
          mkdir dir2
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample0
          output_dir: '.'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample1
          output_dir: 'input'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample2
          output_dir: 'input'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample3
          output_dir: 'dir2'
      - uses: "mermaid-maker/action@main"
        with:
          pkg_manager: 'pnpm'
          input_dir: 'input'
          output_dir: 'same'
      - name: check for generated mermaid files
        run: |
          cat input/sample1.svg
          cat input/sample2.svg
      - name: check for missing mermaid files
        run: |
          cat input/sample0.svg
        continue-on-error: true
        id: failed-step
      - if: ${{steps.failed-step.outcome != 'failure'}}
        run: exit 1
  commit_test:
    name: Test with commit=true
    runs-on: ubuntu-latest
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: mermaid-maker/e2e
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "mermaid-maker/action@main"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
          commit: true
      - name: check for generated mermaid files
        run: |
          cat sample.svg
          cat dir1/sample.svg
          cat dir2/sample.svg
          cat dir1/extra.svg
      - name: remove committed files
        run: |
          git config user.name "${{github.triggering_actor}}"
          git config user.email "${{github.actor}}+${{github.actor_id}}@github_actions.com"
          git rm sample.svg
          git rm dir1/sample.svg
          git rm dir2/sample.svg
          git rm dir1/extra.svg
          git commit -m "test: remove generated, comitted svg files"
          git push
  output_file_extension_commit_test:
    name: Test different output file extensions while committing them to repo 
    runs-on: ubuntu-latest
    strategy:
      matrix:
        output_file_extension: ['svg', 'png', 'pdf']
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: mermaid-maker/e2e
      - uses: "./.github/actions/setup_pkg_manager"
        with:
          pkg_manager: bun
      - run: |
          mkdir dir1
          mkdir dir2
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: '.'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir1'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: sample
          output_dir: 'dir2'
      - uses: "./.github/actions/add_mmd_file"
        with:
          basename: extra
          output_dir: 'dir1'
      - uses: "mermaid-maker/action@main"
        with:
          pkg_manager: 'bun'
          input_dir: 'all'
          output_dir: 'same'
          commit: true
          output_file_extension: ${{matrix.output_file_extension}}
      - name: check for generated mermaid files
        run: |
          cat sample.${{matrix.output_file_extension}}
          cat dir1/sample.${{matrix.output_file_extension}}
          cat dir2/sample.${{matrix.output_file_extension}}
          cat dir1/extra.${{matrix.output_file_extension}}
      - name: remove committed files
        run: |
          git config user.name "${{github.triggering_actor}}"
          git config user.email "${{github.actor}}+${{github.actor_id}}@github_actions.com"
          git rm sample.${{matrix.output_file_extension}}
          git rm dir1/sample.${{matrix.output_file_extension}}
          git rm dir2/sample.${{matrix.output_file_extension}}
          git rm dir1/extra.${{matrix.output_file_extension}}
          git commit -m "test: remove generated, comitted svg files"
          git push